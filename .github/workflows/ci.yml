# Required Build runs for every PR and main update; no path-based pending checks.
name: Build Check
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: theprawngame-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - run: npm test
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test:browser
    - uses: actions/upload-artifact@v6
      with:
        name: prawn-game-build
        path: dist/
        retention-days: '3'
        if-no-files-found: error
    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: prawn-game-browser-evidence
        path: test-results/
        retention-days: '3'
